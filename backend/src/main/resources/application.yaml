spring:
  application:
    name: opsflow-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OPSFLOW_OAUTH2_ISSUER_URI:http://localhost:8081/realms/opsflow}
          audiences:
            - ${OPSFLOW_OAUTH2_AUDIENCE:opsflow-api}
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/opsflow
    username: opsflow
    password: opsflow_local_password
    hikari:
      pool-name: OpsFlowPool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
      initialization-fail-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    validate-on-migrate: true
    validate-migration-naming: true
    baseline-on-migrate: false
    clean-disabled: true
    fail-on-missing-locations: true
    out-of-order: false

  sql:
    init:
      mode: never

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

opsflow:
  security:
    cors:
      allowed-origin: ${OPSFLOW_CORS_ALLOWED_ORIGIN:http://localhost:4200}
